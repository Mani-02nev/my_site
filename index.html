<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>DLD Unit 1 Exam</title>
     <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
     <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
     <style>
          body {
               transition: background-color 0.3s, color 0.3s;
          }

          .main-content {
               height: 100vh;
               display: flex;
               flex-direction: column;
          }

          .sidebar {
               height: 100vh;
               overflow-y: auto;
          }

          .question-card {
               flex-grow: 1;
          }

          .qbtn {
               width: 40px;
               height: 40px;
          }
          
          /* Custom styling for radio buttons */
          .btn-check:checked+.btn-outline-primary {
              background-color: #0d6efd;
              color: white;
          }

          @media (max-width: 768px) {
               .sidebar {
                    height: auto;
                    max-height: 200px;
               }
               .main-content {
                    height: auto;
               }
          }
     </style>
</head>

<body data-bs-theme="light">

     <button id="themeToggle" class="btn position-fixed top-0 end-0 m-3 fs-4" style="z-index: 1001;">
          <i class="bi bi-moon-stars-fill"></i>
     </button>

     <div class="container-fluid">
          <div class="row">
               <nav class="col-md-2 d-md-block bg-body-tertiary sidebar border-end">
                    <div class="position-sticky pt-3">
                         <h2 class="text-center h4">Questions</h2>
                         <div id="qgrid" class="d-flex flex-wrap justify-content-center p-2"></div>
                    </div>
               </nav>

               <main class="col-md-10 ms-sm-auto px-md-4 main-content">
                    <div class="text-center pt-3 pb-2 mb-3 border-bottom">
                         <h1 class="h3">MCQ Exam — WEB Design Unit 1</h1>
                    </div>

                    <div class="card shadow-sm question-card">
                         <div class="card-body d-flex flex-column">
                              <h3 id="qtitle" class="card-title"></h3>
                              <p id="qtext" class="fs-5 mt-2"></p>
                              <div id="options" class="mt-3"></div>
                              <div class="mt-auto d-flex justify-content-end align-items-center">
                                  <div id="timer" class="fw-bold fs-5 text-danger">Time Left: 03:00:00</div>
                              </div>
                         </div>
                    </div>
                    
                    <footer class="d-flex flex-wrap justify-content-between align-items-center py-3 my-4 border-top">
                        <div class="col-md-4">
                           <span class="text-body-secondary">Tip: click a number to jump to that question</span>
                        </div>
                        <div class="col-md-4 d-flex align-items-center justify-content-end">
                             <button class="btn btn-secondary me-2" onclick="prevQ()">Previous</button>
                             <button class="btn btn-primary me-2" onclick="nextQ()">Next</button>
                             <button class="btn btn-success" onclick="submitExam()">Submit</button>
                        </div>
                   </footer>
               </main>
          </div>
     </div>

     <script>
          const themeBtn = document.getElementById("themeToggle");
          const body = document.body;
          const themeIcon = themeBtn.querySelector("i");

          function setTheme(theme) {
               document.documentElement.setAttribute('data-bs-theme', theme);
               if (theme === 'dark') {
                    themeIcon.classList.remove('bi-moon-stars-fill');
                    themeIcon.classList.add('bi-sun-fill');
               } else {
                    themeIcon.classList.remove('bi-sun-fill');
                    themeIcon.classList.add('bi-moon-stars-fill');
               }
               localStorage.setItem("theme", theme);
          }

          themeBtn.addEventListener("click", () => {
               const currentTheme = document.documentElement.getAttribute('data-bs-theme');
               setTheme(currentTheme === 'dark' ? 'light' : 'dark');
          });

          // Set initial theme
          const savedTheme = localStorage.getItem("theme") || 'light';
          setTheme(savedTheme);


          // --- Exam Logic (Updated with Bootstrap classes) ---
          let questions = JSON.parse(localStorage.getItem("examQuestions"));

          if (!questions || questions.length === 0) {
               questions = [
                    { q: "HTML stands for?", opts: ["Hyper Text Markup Language", "HighText Machine Language", "Hyperlinks and Text Markup Language", "None"], ans: 0 },
                    { q: "Which tag is used to create a hyperlink in HTML?", opts: ["<a>", "<link>", "<href>", "<hyper>"], ans: 0 },
                    { q: "Which attribute is used to provide an image source?", opts: ["src", "href", "alt", "link"], ans: 0 },
                    { q: "Which tag is used to display the largest heading?", opts: ["<heading>", "<h6>", "<h1>", "<head>"], ans: 2 },
                    { q: "Which tag is used to insert a line break?", opts: ["<break>", "<br>", "<lb>", "<line>"], ans: 1 },
                    { q: "What is the correct HTML tag for inserting a paragraph?", opts: ["<para>", "<p>", "<pg>", "<paragraph>"], ans: 1 },
                    { q: "Which tag is used for inserting an image?", opts: ["<image>", "<img>", "<src>", "<pic>"], ans: 1 },
                    { q: "HTML comments start with?", opts: ["// comment", "", "# comment", "/* comment */"], ans: 1 },
                    { q: "Which attribute is used to open a link in a new tab?", opts: ["target='_blank'", "newtab", "open='_new'", "tab=new"], ans: 0 },
                    { q: "Which tag is used for unordered lists?", opts: ["<ol>", "<list>", "<ul>", "<li>"], ans: 2 },
               ];
          }

          let currentQ = 0;
          let userAnswers = Array(questions.length).fill(null);
          const qtitle = document.getElementById("qtitle");
          const qtext = document.getElementById("qtext");
          const optionsDiv = document.getElementById("options");
          const qgrid = document.getElementById("qgrid");

          function loadSidebar() {
               qgrid.innerHTML = "";
               for (let i = 0; i < questions.length; i++) {
                    const btn = document.createElement("button");
                    btn.textContent = i + 1;
                    let btnClass = 'btn qbtn m-1 ';
                    if (i === currentQ) {
                        btnClass += 'btn-primary'; // Active question
                    } else if (userAnswers[i] !== null) {
                        btnClass += 'btn-success'; // Answered question
                    } else {
                        btnClass += 'btn-outline-secondary'; // Not answered
                    }
                    btn.className = btnClass;
                    btn.onclick = () => { currentQ = i; loadQuestion(); };
                    qgrid.appendChild(btn);
               }
          }

          function loadQuestion() {
               qtitle.textContent = `Question ${currentQ + 1} of ${questions.length}`;
               qtext.textContent = questions[currentQ].q;
               optionsDiv.innerHTML = "";
               
               const optionsGroup = document.createElement('div');
               optionsGroup.className = 'list-group';
               
               questions[currentQ].opts.forEach((opt, idx) => {
                    const input = document.createElement("input");
                    input.type = "radio";
                    input.className = "btn-check";
                    input.name = "qopt";
                    input.id = `opt${idx}`;
                    input.value = idx;
                    input.autocomplete = "off";
                    if (userAnswers[currentQ] === idx) input.checked = true;
                    
                    input.onchange = () => {
                         userAnswers[currentQ] = idx;
                         loadSidebar();
                    };

                    const label = document.createElement("label");
                    label.className = "btn btn-outline-primary w-100 my-1 text-start";
                    label.setAttribute("for", `opt${idx}`);
                    label.textContent = opt;

                    optionsDiv.appendChild(input);
                    optionsDiv.appendChild(label);
               });
               loadSidebar();
          }

          function nextQ() {
               if (currentQ < questions.length - 1) {
                    currentQ++;
                    loadQuestion();
               }
          }

          function prevQ() {
               if (currentQ > 0) {
                    currentQ--;
                    loadQuestion();
               }
          }

          function submitExam() {
               let score = 0;
               questions.forEach((q, i) => {
                    if (userAnswers[i] === q.ans) score++;
               });
               alert(`You scored ${score} out of ${questions.length}`);
          }

          loadQuestion();
          let totalSeconds = 3 * 60 * 60;

          function startTimer() {
               const timerEl = document.getElementById('timer');
               const timerInterval = setInterval(() => {
                    totalSeconds--;
                    let hours = Math.floor(totalSeconds / 3600);
                    let minutes = Math.floor((totalSeconds % 3600) / 60);
                    let seconds = totalSeconds % 60;

                    hours = String(hours).padStart(2, '0');
                    minutes = String(minutes).padStart(2, '0');
                    seconds = String(seconds).padStart(2, '0');

                    timerEl.textContent = `Time Left: ${hours}:${minutes}:${seconds}`;

                    if (totalSeconds <= 0) {
                         clearInterval(timerInterval);
                         alert("Time's up! Submitting your answers...");
                         submitExam();
                    }
               }, 1000);
          }
          startTimer();
     </script>
     <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
