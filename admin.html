<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Admin - Question Builder</title>
     <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
     <style>
          body {
               font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
               background: linear-gradient(135deg, #7a9ecf, #59569a);
               padding: 20px 0;
               min-height: 100vh;
          }
     </style>
</head>

<body>
     <div class="container">
          <div class="card shadow-lg">
               <div class="card-body p-4">
                    <h2 class="card-title text-center text-primary mb-4">🛠 Admin - Question Builder</h2>
                    <div class="mb-3">
                         <label for="questionText" class="form-label fw-bold">Enter Question:</label>
                         <input type="text" id="questionText" class="form-control" placeholder="Type your question here...">
                    </div>

                    <div class="mb-3">
                         <label class="form-label fw-bold">Options:</label>
                         <input type="text" id="opt0" class="form-control mb-2" placeholder="Option 1">
                         <input type="text" id="opt1" class="form-control mb-2" placeholder="Option 2">
                         <input type="text" id="opt2" class="form-control mb-2" placeholder="Option 3">
                         <input type="text" id="opt3" class="form-control" placeholder="Option 4">
                    </div>

                    <div class="mb-3">
                         <label for="correctAns" class="form-label fw-bold">Correct Answer (Index 0-3):</label>
                         <input type="text" id="correctAns" class="form-control" placeholder="Enter option index (e.g., 0, 1, 2, or 3)">
                    </div>

                    <div class="d-flex justify-content-center gap-2 flex-wrap">
                         <button class="btn btn-primary" onclick="addQuestion()">Add Question</button>
                         <button class="btn btn-success" onclick="saveToExam()">Save for Exam</button>
                         <button class="btn btn-warning" onclick="resetExam()">Reset Exam to Default</button>
                    </div>

                    <hr class="my-4">

                    <div id="questionList"></div>
               </div>
          </div>
     </div>

     <script>
          let questions = [];

          function renderQuestions() {
               const listDiv = document.getElementById("questionList");
               listDiv.innerHTML = "";

               if (questions.length === 0) {
                    listDiv.innerHTML = "<p class='text-center text-muted'>No questions added yet.</p>";
                    return;
               }

               const listGroup = document.createElement("ul");
               listGroup.className = "list-group";

               questions.forEach((q, index) => {
                    const item = document.createElement("li");
                    item.className = "list-group-item d-flex justify-content-between align-items-center";
                    
                    item.textContent = `${index + 1}. ${q.q}`;
                    
                    const removeBtn = document.createElement("button");
                    removeBtn.textContent = "Remove";
                    removeBtn.className = "btn btn-danger btn-sm";
                    removeBtn.onclick = () => deleteQuestion(index);

                    item.appendChild(removeBtn);
                    listGroup.appendChild(item);
               });
               listDiv.appendChild(listGroup);
          }

          function deleteQuestion(index) {
               questions.splice(index, 1);
               renderQuestions();
          }

          function addQuestion() {
               const qText = document.getElementById("questionText").value.trim();
               const opts = [
                    document.getElementById("opt0").value.trim(),
                    document.getElementById("opt1").value.trim(),
                    document.getElementById("opt2").value.trim(),
                    document.getElementById("opt3").value.trim()
               ];
               const ans = parseInt(document.getElementById("correctAns").value);

               if (!qText || opts.some(o => !o) || isNaN(ans) || ans < 0 || ans > 3) {
                    alert("⚠️ Please fill all fields and provide a valid correct answer (0-3).");
                    return;
               }

               questions.push({ q: qText, opts: opts, ans: ans });
               
               document.getElementById("questionText").value = "";
               document.getElementById("opt0").value = "";
               document.getElementById("opt1").value = "";
               document.getElementById("opt2").value = "";
               document.getElementById("opt3").value = "";
               document.getElementById("correctAns").value = "";

               renderQuestions();
          }

          function saveToExam() {
               if (questions.length === 0) {
                    alert("⚠️ Please add at least one question first!");
                    return;
               }
               localStorage.setItem("examQuestions", JSON.stringify(questions));
               alert(`✅ ${questions.length} question(s) saved! Now open your Exam Site.`);
          }
          
          function resetExam() {
               if (confirm("Are you sure you want to delete all saved questions and reset the exam to its default state?")) {
                    localStorage.removeItem("examQuestions");
                    alert("✅ Exam has been reset to default questions. The custom questions have been deleted.");
               }
          }

          renderQuestions();
     </script>
     <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
