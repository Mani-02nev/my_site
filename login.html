<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Exam Login</title>
     <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
     <style>
          body {
               font-family: "Segoe UI", Arial, sans-serif;
               background: linear-gradient(135deg, #2f82f7e3, #6A5ACD);
               display: flex;
               justify-content: center;
               align-items: center;
               min-height: 100vh;
               margin: 0;
          }

          .login-card {
               width: 100%;
               max-width: 400px;
               animation: fadeIn 0.8s ease-in-out;
          }

          .btn-primary {
               transition: 0.3s ease;
          }

          .btn-primary:hover {
               transform: scale(1.05);
          }

          @keyframes fadeIn {
               from {
                    opacity: 0;
                    transform: translateY(-20px);
               }

               to {
                    opacity: 1;
                    transform: translateY(0);
               }
          }
     </style>
</head>

<body>
     <div class="card p-4 shadow-lg login-card">
          <div class="card-body">
               <h2 class="card-title text-center mb-4">Exam Login</h2>
               <div class="mb-3">
                    <input type="text" id="username" class="form-control form-control-lg" placeholder="Enter Username">
               </div>
               <div class="mb-3">
                    <input type="password" id="password" class="form-control form-control-lg" placeholder="Enter Password">
               </div>
               <div class="d-grid">
                    <button class="btn btn-primary btn-lg" onclick="login()">Login</button>
               </div>
          </div>
     </div>

     <script>
          function login() {
               let user = document.getElementById("username").value.trim();
               let pass = document.getElementById("password").value.trim();

               if (user === "sit@user" && pass === "1234") {
                    localStorage.setItem("examUser", user);
                    window.location.href = "index.html";
               } else if (user === "sit@admin" && pass === "1234") {
                    localStorage.setItem("adminUser", user);
                    window.location.href = "admin.html";
               } else {
                    alert("Invalid login");
               }
          }
     </script>
     <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
